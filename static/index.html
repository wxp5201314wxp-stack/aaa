<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>仓序 · 进销存管理</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><a class="brand" href="/">▦ <span>仓序<small>INVENTORY WORKSPACE</small></span></a><div class="space-label">工作空间</div><nav><button data-page="overview" class="active">◈　经营概览</button><button data-page="products">▦　商品与库存</button><button data-page="in">↙　采购入库</button><button data-page="out">↗　销售出库</button><button data-page="history">≡　出入库记录</button></nav><div class="aside-bottom"><span class="status-dot"></span> 本地数据持久化<small>仓序 · 让每一件商品有迹可循</small></div></aside>
<main><header><div class="breadcrumb">工作空间 <span>/</span> <b id="crumb">经营概览</b></div><div class="profile"><span id="date"></span><i>管</i> 管理员</div></header><section class="content"><div class="title-row"><div><div class="eyebrow">YOUR BUSINESS, AT A GLANCE</div><h1 id="title">经营概览</h1><p id="subtitle">掌握库存动态，让经营井然有序。</p></div><div class="actions"><button class="secondary" id="scan-search">▤ 扫码查商品</button><button class="secondary" id="export">↓ 导出库存</button><button class="primary" id="create">＋ 新增商品</button></div></div><div id="view"></div><footer>仓序 INVENTORY <span>数据实时更新 · 金额单位：人民币</span></footer></section></main>
<dialog id="dialog"><form id="form"><div class="modal-head"><h2 id="modal-title"></h2><button type="button" id="close" aria-label="关闭">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="modal-actions"><button type="button" class="secondary" id="cancel">取消</button><button type="submit" class="primary" id="submit">确认保存</button></div></form></dialog><dialog id="scanner-dialog" aria-labelledby="scanner-title"><div class="modal-head"><h2 id="scanner-title">扫描商品条码</h2><button type="button" id="scan-close" aria-label="关闭扫码">×</button></div><p>对准商品背面的条形码，或选择清晰的条码照片。识别后请核对编码。</p><div id="barcode-reader"></div><p id="scan-status" role="status"></p><div class="scan-actions"><button type="button" class="primary" id="scan-camera">开启摄像头</button><label class="secondary">拍照 / 选择图片<input id="scan-file" type="file" accept="image/*" capture="environment"></label></div><p>照片仅在浏览器内识别，不上传服务器。支持 EAN、UPC、Code 128 等常见商品条码；不识别普通印刷文字。</p></dialog><div id="toast" role="status"></div><script src="/vendor/html5-qrcode.min.js"></script><script src="/app.js"></script><script src="/scanner.js"></script></body></html>
